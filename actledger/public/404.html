<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Sayfa bulunamadı (404) | AskDesk</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f9fafb;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 480px; }
      .code {
        display: block;
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
        color: #2563eb;
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 1.6; color: #6b7280; margin: 0 0 8px; }
      .en { font-size: 14px; }
      .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .primary { background: #2563eb; color: #fff; }
      .primary:hover { background: #1d4ed8; }
      .secondary { border: 1px solid #e5e7eb; color: #111827; background: #fff; }
      .secondary:hover { border-color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="code">404</span>
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir.</p>
      <p class="en">The page you are looking for could not be found.</p>
      <div class="actions">
        <a class="primary" href="/">Ana sayfa</a>
        <a class="secondary" href="/blog/">Blog</a>
      </div>
    </div>
  </body>
</html>
