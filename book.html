<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Meeting - ATAOL AI Techs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; }
        .card { background: #fff; border-radius: 16px; width: 480px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0f2460 100%); padding: 24px 30px 20px; }
        .header img { height: 40px; }
        .header .line { margin-top: 10px; height: 3px; background: linear-gradient(90deg, #4fc3f7, #22d3ee, #1976d2, transparent); border-radius: 2px; }
        .body { padding: 30px; }
        .company-name { font-size: 14px; color: #888; margin-bottom: 4px; }
        h1 { font-size: 20px; color: #1a1a2e; margin-bottom: 20px; font-weight: 700; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; margin-top: 16px; }
        input[type="date"], input[type="time"], input[type="text"], input[type="email"], textarea, select {
            width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; font-family: inherit; background: #f8f9fc; transition: border 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1976d2; background: #fff; }
        textarea { resize: vertical; min-height: 80px; }
        .time-row { display: flex; gap: 12px; }
        .time-row > div { flex: 1; }
        .tz-note { font-size: 11px; color: #888; margin-top: 4px; }
        .submit-btn {
            display: block; width: 100%; padding: 14px; margin-top: 24px;
            background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; border: none;
            border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { background: #f8f9fa; padding: 16px 30px; border-top: 1px solid #eee; }
        .footer p { font-size: 11px; color: #888; }
        .footer a { color: #1976d2; text-decoration: none; }
        .success { display: none; text-align: center; padding: 40px 30px; }
        .success h2 { color: #2e7d32; margin-bottom: 8px; }
        .success p { color: #666; font-size: 14px; }
        .error-msg { display: none; text-align: center; padding: 20px 30px; }
        .error-msg h2 { color: #c62828; margin-bottom: 8px; font-size: 18px; }
        .error-msg p { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="ataol-logo.png" alt="ATAOL AI Techs" />
            <div class="line"></div>
        </div>

        <div class="body" id="formView">
            <p class="company-name" id="companyLabel"></p>
            <h1 id="pageTitle">Schedule a Meeting</h1>

            <label id="labelName">Your Name</label>
            <input type="text" id="meetName" placeholder="">

            <label id="labelEmail">Your Email</label>
            <input type="email" id="meetEmail" placeholder="">

            <label id="labelDate">Preferred Date</label>
            <input type="date" id="meetDate" />

            <div class="time-row">
                <div>
                    <label id="labelTime">Preferred Time</label>
                    <select id="meetTime">
                        <option value="09:00">09:00</option>
                        <option value="09:30">09:30</option>
                        <option value="10:00" selected>10:00</option>
                        <option value="10:30">10:30</option>
                        <option value="11:00">11:00</option>
                        <option value="11:30">11:30</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00">13:00</option>
                        <option value="13:30">13:30</option>
                        <option value="14:00">14:00</option>
                        <option value="14:30">14:30</option>
                        <option value="15:00">15:00</option>
                        <option value="15:30">15:30</option>
                        <option value="16:00">16:00</option>
                        <option value="16:30">16:30</option>
                        <option value="17:00">17:00</option>
                    </select>
                </div>
                <div>
                    <label id="labelDuration">Duration</label>
                    <select id="meetDuration">
                        <option value="30">30 min</option>
                        <option value="45">45 min</option>
                        <option value="60">60 min</option>
                    </select>
                </div>
            </div>
            <p class="tz-note" id="tzNote"></p>

            <label id="labelTopic">Meeting Topic</label>
            <textarea id="meetTopic" placeholder=""></textarea>

            <button class="submit-btn" id="submitBtn" onclick="submitForm()">Send Request</button>
        </div>

        <div class="success" id="successView">
            <h2 id="successTitle">Request Sent!</h2>
            <p id="successMsg">Your meeting request has been sent. We will confirm shortly via email.</p>
        </div>

        <div class="error-msg" id="errorView">
            <h2 id="errorTitle">Something went wrong</h2>
            <p id="errorMsg">Please try again or contact us directly at support@strategythrust.com</p>
            <button class="submit-btn" style="margin-top:16px;" id="retryBtn" onclick="retryForm()">Try Again</button>
        </div>

        <div class="footer">
            <p>ATAOL AI Techs - <a href="https://www.ataolai.tech">ataolai.tech</a> | <a href="https://strategythrust.com">strategythrust.com</a> | <a href="https://actledger.com">actledger.com</a></p>
        </div>
    </div>

<script>
const params = new URLSearchParams(window.location.search);
const company = params.get('company') || '';
const contactEmail = params.get('email') || '';
const contactName = params.get('name') || '';
const tz = parseInt(params.get('tz') || '0', 10);
const lang = params.get('lang') || 'en';
const isTR = lang === 'tr';

// Pre-fill from query params
if (contactName) document.getElementById('meetName').value = contactName;
if (contactEmail) document.getElementById('meetEmail').value = contactEmail;

// Set min date to tomorrow
const tomorrow = new Date();
tomorrow.setDate(tomorrow.getDate() + 1);
while (tomorrow.getDay() === 0 || tomorrow.getDay() === 6) tomorrow.setDate(tomorrow.getDate() + 1);
document.getElementById('meetDate').min = tomorrow.toISOString().split('T')[0];
document.getElementById('meetDate').value = tomorrow.toISOString().split('T')[0];

// Localize
if (isTR) {
    document.title = 'G\u00f6r\u00fc\u015fme Planla - ATAOL AI Techs';
    document.getElementById('pageTitle').textContent = 'G\u00f6r\u00fc\u015fme Planla';
    document.getElementById('labelName').textContent = 'Ad\u0131n\u0131z';
    document.getElementById('labelEmail').textContent = 'Email Adresiniz';
    document.getElementById('labelDate').textContent = 'Tercih Edilen Tarih';
    document.getElementById('labelTime').textContent = 'Tercih Edilen Saat';
    document.getElementById('labelDuration').textContent = 'S\u00fcre';
    document.getElementById('labelTopic').textContent = 'G\u00f6r\u00fc\u015fme Konusu';
    document.getElementById('meetName').placeholder = 'Ad\u0131n\u0131z Soyad\u0131n\u0131z';
    document.getElementById('meetEmail').placeholder = 'ornek@firma.com';
    document.getElementById('meetTopic').placeholder = 'G\u00f6r\u00fc\u015fmek istedi\u011finiz konuyu k\u0131saca belirtin...';
    document.getElementById('submitBtn').textContent = 'G\u00f6r\u00fc\u015fme Talebi G\u00f6nder';
    document.getElementById('tzNote').textContent = 'Saatler T\u00fcrkiye saatine g\u00f6redir (UTC+3)';
    document.getElementById('successTitle').textContent = 'Talebiniz G\u00f6nderildi!';
    document.getElementById('successMsg').textContent = 'G\u00f6r\u00fc\u015fme talebiniz iletildi. En k\u0131sa s\u00fcrede email ile d\u00f6n\u00fc\u015f yapaca\u011f\u0131z.';
    document.getElementById('errorTitle').textContent = 'Bir hata olu\u015ftu';
    document.getElementById('errorMsg').textContent = 'L\u00fctfen tekrar deneyin veya support@strategythrust.com adresinden bize ula\u015f\u0131n.';
    document.getElementById('retryBtn').textContent = 'Tekrar Dene';
    document.querySelectorAll('#meetDuration option').forEach(function(o) {
        o.textContent = o.value + ' dk';
    });
} else {
    document.getElementById('meetName').placeholder = 'Your full name';
    document.getElementById('meetEmail').placeholder = 'you@company.com';
    document.getElementById('meetTopic').placeholder = 'Briefly describe what you would like to discuss...';
    var tzLabel = tz >= 0 ? 'UTC+' + tz : 'UTC' + tz;
    document.getElementById('tzNote').textContent = 'Times shown in your local timezone (' + tzLabel + ')';
}

if (company) {
    document.getElementById('companyLabel').textContent = company;
}

function retryForm() {
    document.getElementById('errorView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
}

async function submitForm() {
    var name = document.getElementById('meetName').value.trim();
    var email = document.getElementById('meetEmail').value.trim();
    var date = document.getElementById('meetDate').value;
    var time = document.getElementById('meetTime').value;
    var duration = document.getElementById('meetDuration').value;
    var topic = document.getElementById('meetTopic').value.trim();

    if (!name) { alert(isTR ? 'L\u00fctfen ad\u0131n\u0131z\u0131 girin.' : 'Please enter your name.'); return; }
    if (!email) { alert(isTR ? 'L\u00fctfen email adresinizi girin.' : 'Please enter your email.'); return; }
    if (!date) { alert(isTR ? 'L\u00fctfen tarih se\u00e7in.' : 'Please select a date.'); return; }
    if (!topic) { alert(isTR ? 'L\u00fctfen g\u00f6r\u00fc\u015fme konusunu belirtin.' : 'Please describe the meeting topic.'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = isTR ? 'G\u00f6nderiliyor...' : 'Sending...';

    var tzStr = isTR ? 'T\u00fcrkiye saati' : (tz >= 0 ? 'UTC+' + tz : 'UTC' + tz);
    var durationLabel = isTR ? duration + ' dakika' : duration + ' minutes';

    try {
        var resp = await fetch('https://formsubmit.co/ajax/support@strategythrust.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                _subject: 'Meeting Request - ' + (company || 'New') + ' x ATAOL AI Techs',
                _template: 'table',
                _captcha: 'false',
                _replyto: email,
                'Company': company || '-',
                'Contact Name': name,
                'Contact Email': email,
                'Preferred Date': date,
                'Preferred Time': time + ' (' + tzStr + ')',
                'Duration': durationLabel,
                'Meeting Topic': topic,
                'Language': isTR ? 'Turkish' : 'English',
                'Submitted At': new Date().toISOString()
            })
        });

        if (resp.ok) {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';
        } else {
            throw new Error('Server error');
        }
    } catch (e) {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('errorView').style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = isTR ? 'G\u00f6r\u00fc\u015fme Talebi G\u00f6nder' : 'Send Request';
    }
}
</script>
</body>
</html>
